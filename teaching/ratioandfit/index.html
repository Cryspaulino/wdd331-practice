<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>object-fit & aspect-ratio Demo</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./main.js" defer></script>

</head>

<body>
    <p>
        Use the controls to experiment with
        <code>object-fit</code> and
        <code>aspect-ratio</code>.
    </p>

    <div class="controls">

        <label>
            object-fit:
            <select id="fitSelect">
                <option value="cover">cover</option>
                <option value="contain">contain</option>
                <option value="fill">fill</option>
                <option value="none">none</option>
                <option value="scale-down">scale-down</option>
            </select>
        </label>

        <label>
            aspect-ratio:
            <select id="ratioSelect">
                <option value="16 / 9">16 / 9</option>
                <option value="4 / 3">4 / 3</option>
                <option value="1 / 1">1 / 1</option>
                <option value="3 / 4">3 / 4</option>
                <option value="21 / 9">21 / 9</option>
            </select>
        </label>

    </div>

    <div class="card">
        <div class="thumbnail" id="thumbnail">
            <img id="demoImage" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200"
                alt="Landscape" />
        </div>

        <div class="content">
            <h2>Sample Card</h2>

            <div class="status">
                aspect-ratio:
                <code id="ratioValue">16 / 9</code>
                &nbsp;&nbsp;
                object-fit:
                <code id="fitValue">cover</code>
            </div>
        </div>
    </div>
